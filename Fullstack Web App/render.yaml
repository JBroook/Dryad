
databases:
  - name: dryad-db
    plan: free
    region: singapore
    databaseName: dryad
    user: dryad_user

services:
  - type: web
    name: dryad-backend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./backend/dockerfile
    dockerContext: ./backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dryad-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

  - type: web
    name: dryad-frontend
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./frontend/dryad/dockerfile
    dockerContext: ./frontend/dryad
    envVars:
      - key: NODE_ENV
        value: production
      - key: INTERNAL_API_URL
        sync: false
      - key: NEXT_PUBLIC_API_URL
        sync: false
