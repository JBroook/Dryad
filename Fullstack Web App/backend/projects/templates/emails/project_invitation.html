
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{project_name}}: Project Invitation</title>
</head>

<body style="
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
    color: #e8f5ee;
">

    <table width="100%" cellpadding="0" cellspacing="0" border="0"
        style="padding: 40px 20px;">

        <tr>
            <td align="center">

                <table width="100%" cellpadding="0" cellspacing="0" border="0"
                    style="
                        max-width: 600px;
                        background-color: #12221a;
                        border: 1px solid #254936;
                        border-radius: 12px;
                        overflow: hidden;
                    ">

                    <!-- Header -->
                    <tr>
                        <td style="
                            padding: 28px 32px;
                            background-color: #163522;
                            border-bottom: 1px solid #2b513c;
                        ">

                            <div style="
                                font-size: 13px;
                                font-weight: bold;
                                letter-spacing: 1.5px;
                                color: #7fd19c;
                                text-transform: uppercase;
                            ">
                                Dryad
                            </div>

                            <div style="
                                margin-top: 8px;
                                font-size: 26px;
                                font-weight: bold;
                                color: #ffffff;
                            ">
                                You're Invited to {{project_name}}!
                            </div>

                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td style="padding: 32px;">

                            <!-- Invitation -->
                            <div style="
                                padding: 20px;
                                background-color: #193b29;
                                border-left: 4px solid #52c878;
                                border-radius: 6px;
                                margin-bottom: 28px;
                            ">

                                <div style="
                                    font-size: 18px;
                                    line-height: 1.6;
                                    color: #ffffff;
                                ">
                                    You've been invited to join
                                    <strong>{{project_name}}</strong>
                                    by <strong>{{sender_name}}</strong>.
                                </div>

                                <div style="
                                    margin-top: 8px;
                                    font-size: 14px;
                                    color: #a8c7b4;
                                ">
                                    Invitation Date: {{invite_date}}
                                </div>

                            </div>

                            <!-- Project -->
                            <div style="margin-bottom: 30px;">

                                <div style="
                                    font-size: 12px;
                                    font-weight: bold;
                                    letter-spacing: 1px;
                                    text-transform: uppercase;
                                    color: #72bd8d;
                                    margin-bottom: 8px;
                                ">
                                    Project Details
                                </div>

                                <div style="
                                    padding: 14px 16px;
                                    background-color: #0e1c15;
                                    border: 1px solid #254936;
                                    border-radius: 6px;
                                    font-family: monospace;
                                    font-size: 14px;
                                    color: #d6e9dd;
                                ">
                                    {{project_name}}
                                </div>

                            </div>

                            <!-- Open Button -->
                            <table cellpadding="0" cellspacing="0" border="0">
                                <tr>
                                    <td align="center"
                                        style="
                                            background-color: #3fae68;
                                            border-radius: 7px;
                                        ">

                                        <a href="{{website_url}}"
                                            style="
                                                display: inline-block;
                                                padding: 14px 32px;
                                                font-size: 15px;
                                                font-weight: bold;
                                                color: #ffffff;
                                                text-decoration: none;
                                                border-radius: 7px;
                                            ">
                                            View Invitation
                                        </a>

                                    </td>
                                </tr>
                            </table>

                            <div style="
                                margin-top: 28px;
                                font-size: 12px;
                                line-height: 1.5;
                                color: #718a7a;
                            ">
                                You have received this email because you were invited to a project on Dryad.
                            </div>

                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td style="
                            padding: 20px 32px;
                            background-color: #0e1c15;
                            border-top: 1px solid #254936;
                            text-align: center;
                            font-size: 12px;
                            color: #61796b;
                        ">
                            Dryad: Project Invitation
                        </td>
                    </tr>

                </table>

            </td>
        </tr>

    </table>

</body>
</html>
